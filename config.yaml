# example config file.

brightness: 20 # 0-100
pages:
  - buttons:
      - # index is a 0-based button index on the Stream Deck, left to right from
        # top to bottom.
        # For example:
        # 0 1 2 3
        # 4 5 6 7
        index: 1
        # Image requirements:
        # https://docs.elgato.com/streamdeck/hid/stream-deck-classic#uploading-images
        image_path: /home/users/icons/someprogram.jpg
        command: [/usr/bin/someprogram, -some-arg]
      - index: 3
        image_path: /home/users/icons/next.jpg
        # Special command to set buttons to next page.
        command: [page_next]
      - index: 7
        image_path: /home/users/icons/reload.jpg
        # Special command to reload config file.
        command: [reload]
  - buttons:
      - index: 0
        image_path: /home/users/icons/prev.jpg
        command: [page_prev]
      - index: 6
        image_path: /home/users/icons/someprogram.jpg
        command: [/usr/bin/someprogram]
